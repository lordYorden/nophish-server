services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nophish
      POSTGRES_PASSWORD: nophish
      POSTGRES_DB: nophish
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    init: true
    ipc: host
    environment:
      - PYTHONUNBUFFERED=1
      - DYNAMIC_URL_SCANNER_ENABLE_BROWSER=true
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql+psycopg://nophish:nophish@postgres:5432/nophish
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/serviceKey.json
    volumes:
      - hf_cache:/app/.hf_cache   # persist downloaded HuggingFace models
      - ./serviceKey.json:/run/secrets/serviceKey.json:ro  # injected at runtime, never in the image
    depends_on:
      - redis
      - postgres

volumes:
  pgdata:
  hf_cache:
